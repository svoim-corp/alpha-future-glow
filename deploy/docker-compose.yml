# Запуск проекта целиком: БД, моки внешних сервисов, сервер и клиент.
#
#   cd deploy
#   docker compose up --build
#
# Клиент:   http://localhost:3000
# API:      http://localhost:3000/api/v1 (через прокси клиента) или http://localhost:8080/api/v1
# Swagger:  http://localhost:8080/api/docs
#
# Переменные можно переопределить в deploy/.env (пример — .env.example).

name: credit-cabinet

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cabinet}
      POSTGRES_USER: ${POSTGRES_USER:-cabinet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabinet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Моки внешних сервисов (ЕГРЮЛ, БКИ, ФНС и т.д.), API_SPEC.md, раздел 4.14.
  # Собираются из того же Go-модуля, что и сервер: ./cmd/mocks.
  mocks:
    build:
      context: ../backend
      args:
        APP: mocks
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Сервер: ./cmd/api.
  backend:
    build:
      context: ../backend
      args:
        APP: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      APP_PROFILE: ${APP_PROFILE:-demo}
      DATABASE_URL: postgres://${POSTGRES_USER:-cabinet}:${POSTGRES_PASSWORD:-cabinet}@db:5432/${POSTGRES_DB:-cabinet}?sslmode=disable
      MOCKS_BASE_URL: http://mocks:8090
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Клиент: статика React за nginx, /api проксируется на backend,
  # поэтому cookie сессии живёт на одном origin с клиентом.
  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
