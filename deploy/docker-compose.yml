# Запуск проекта целиком: БД, моки внешних сервисов, сервер и клиент.
#
#   cd deploy
#   docker compose up --build
#
# Клиент:   http://localhost:3000
# API:      http://localhost:3000/api/v1 (через прокси клиента) или http://localhost:8080/api/v1
# Swagger:  http://localhost:8080/api/docs
#
# Переменные можно переопределить в deploy/.env (пример — .env.example).

name: credit-cabinet

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cabinet}
      POSTGRES_USER: ${POSTGRES_USER:-cabinet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabinet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Моки внешних сервисов (ЕГРЮЛ, БКИ, ФНС и т.д.), API_SPEC.md, раздел 4.14.
  # Собираются из того же Go-модуля, что и сервер: ./cmd/mocks.
  mocks:
    build:
      context: ../backend
      args:
        APP: mocks
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Сервер: ./cmd/api.
  backend:
    build:
      context: ../backend
      args:
        APP: api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      APP_PROFILE: ${APP_PROFILE:-demo}
      DATABASE_URL: postgres://${POSTGRES_USER:-cabinet}:${POSTGRES_PASSWORD:-cabinet}@db:5432/${POSTGRES_DB:-cabinet}?sslmode=disable
      MOCKS_BASE_URL: http://mocks:8090
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b-q4_K_M}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3:567m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Клиент: статика React за nginx, /api проксируется на backend,
  # поэтому cookie сессии живёт на одном origin с клиентом.
  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai-models:
    image: ollama/ollama:0.12.6
    profiles: [ai]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "/config/prepare-models.sh"]
    volumes:
      - ollama-data:/root/.ollama:ro
      - ./prepare-models.sh:/config/prepare-models.sh:ro
      - ./models.sha256:/config/models.sha256:ro
    depends_on:
      ollama:
        condition: service_healthy
    # Нужны только для начальной подготовки; дальнейший запуск работает без интернета.
    env_file:
      - path: .env.models
        required: true

  ai-index:
    profiles: [ai]
    build:
      context: ../backend
      args:
        APP: support-index
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cabinet}:${POSTGRES_PASSWORD:-cabinet}@db:5432/${POSTGRES_DB:-cabinet}?sslmode=disable
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b-q4_K_M}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3:567m}
    depends_on:
      backend:
        condition: service_healthy
      ai-models:
        condition: service_completed_successfully

volumes:
  db-data:
  ollama-data:
