        type: string
      id:
        example: n-15
        type: string
      link:
        example: /applications/a-1024
        type: string
      read:
        example: false
        type: boolean
      text:
        example: Уточните фактический адрес склада
        type: string
      title:
        example: Банку нужны пояснения по заявке
        type: string
      type:
