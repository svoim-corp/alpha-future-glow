basePath: /api/v1
definitions:
  catalog.calculatorRequest:
    properties:
      amount:
        example: 6000000
        type: integer
      graceMonths:
        description: 0 или null — без отсрочки
        example: 6
        minimum: 0
        type: integer
      productCode:
        example: INVEST
        type: string
      term:
        example: 60
        type: integer
    required:
    - amount
    - productCode
    - term
    type: object
  catalog.calculatorResponse:
    properties:
      gracePayment:
        allOf:
        - $ref: '#/definitions/catalog.gracePaymentDTO'
        description: null — без отсрочки
      payment:
        $ref: '#/definitions/catalog.moneyRangeDTO'
      rate:
        $ref: '#/definitions/catalog.rateRangeDTO'
      withinProductLimits:
        example: true
        type: boolean
    type: object
  catalog.goalDTO:
    properties:
      code:
        example: WORKING_CAPITAL
        type: string
      name:
        example: Пополнить оборотные средства
        type: string
    type: object
  catalog.gracePaymentDTO:
    properties:
      max:
        example: 130000
        type: integer
      min:
        example: 90000
        type: integer
      months:
        example: 6
        type: integer
    type: object
  catalog.matchDTO:
    properties:
      code:
        example: WORKING
        type: string
      fits:
        example: true
        type: boolean
      reason:
        example: Подходит по цели, сумме и сроку
        type: string
    type: object
  catalog.matchRequest:
    properties:
      amount:
        example: 1500000
        type: integer
      goal:
        example: WORKING_CAPITAL
        type: string
      term:
        description: 0 или нет поля — срок не проверяется
        example: 24
        minimum: 0
        type: integer
    required:
    - amount
    - goal
    type: object
  catalog.moneyRangeDTO:
    properties:
      max:
        example: 10000000
        type: integer
      min:
        example: 300000
        type: integer
    type: object
  catalog.productDetailsDTO:
    properties:
      amount:
        $ref: '#/definitions/catalog.moneyRangeDTO'
      code:
        example: WORKING
        type: string
      description:
        example: Оборудование, помещение, расширение бизнеса
        type: string
      goals:
        example:
        - WORKING_CAPITAL
        items:
          type: string
        type: array
      graceMaxMonths:
        description: null — отсрочки нет
        example: 6
        type: integer
      limitRule:
        example: До 15% годового оборота по счетам в банке
        type: string
      name:
        example: Оборотный кредит
        type: string
      rate:
        $ref: '#/definitions/catalog.rateRangeDTO'
      requirements:
        $ref: '#/definitions/catalog.requirementsDTO'
      shortText:
        example: Закупки, зарплата, налоги, аренда
        type: string
      term:
        $ref: '#/definitions/catalog.termRangeDTO'
      whatYouNeed:
        example:
        - Согласие на запрос в БКИ
        items:
          type: string
        type: array
    type: object
  catalog.productSummaryDTO:
    properties:
      amount:
        $ref: '#/definitions/catalog.moneyRangeDTO'
      code:
        example: WORKING
        type: string
      goals:
        example:
        - WORKING_CAPITAL
        items:
          type: string
        type: array
      name:
        example: Оборотный кредит
        type: string
      rate:
        $ref: '#/definitions/catalog.rateRangeDTO'
      shortText:
        example: Закупки, зарплата, налоги, аренда
        type: string
      term:
        $ref: '#/definitions/catalog.termRangeDTO'
    type: object
  catalog.rateRangeDTO:
    properties:
      max:
        example: 28
        type: number
      min:
        example: 20
        type: number
    type: object
  catalog.requirementsDTO:
    properties:
      guarantorForLlc:
        example: true
        type: boolean
      minBusinessAgeMonths:
        description: null — требования к возрасту бизнеса нет
        example: 12
        type: integer
    type: object
  catalog.termRangeDTO:
    properties:
      max:
        example: 36
        type: integer
      min:
        example: 3
        type: integer
    type: object
  company.candidateDTO:
    properties:
      fullName:
        example: Смирнов Олег Викторович
        type: string
      personId:
        example: p-1
        type: string
      roles:
        example:
        - HEAD
        - FOUNDER
        items:
          $ref: '#/definitions/shared.PersonRole'
        type: array
    type: object
  company.founderDTO:
    properties:
      fullName:
        example: Смирнов Олег Викторович
        type: string
      personId:
        example: p-1
        type: string
      share:
        example: 100
        type: number
    type: object
  company.girboDTO:
    properties:
      accounted:
        example: true
        type: boolean
    type: object
  company.okvedDTO:
    properties:
      code:
        example: "10.71"
        type: string
      name:
        example: Производство хлеба
        type: string
    type: object
  company.personRefDTO:
    properties:
      fullName:
        example: Смирнов Олег Викторович
        type: string
      personId:
        example: p-1
        type: string
    type: object
  company.profileResponse:
    properties:
      actualAddress:
        example: г. Москва, ул. Складская, 3
        type: string
      founders:
        items:
          $ref: '#/definitions/company.founderDTO'
        type: array
      girbo:
        allOf:
        - $ref: '#/definitions/company.girboDTO'
        description: 'null у ИП: ГИР БО ведётся только по юрлицам'
      guarantorCandidates:
        items:
          $ref: '#/definitions/company.candidateDTO'
        type: array
      head:
        $ref: '#/definitions/company.personRefDTO'
      okved:
        $ref: '#/definitions/company.okvedDTO'
      regAddress:
        example: г. Москва, ул. Пекарская, 7
        type: string
      source:
        example:
        - BANK
        - EGRUL
        items:
          $ref: '#/definitions/shared.CheckSource'
        type: array
      taxRegime:
        example: USN_INCOME_MINUS_EXPENSES
        type: string
      turnover:
        $ref: '#/definitions/company.turnoverDTO'
    type: object
  company.turnoverDTO:
    properties:
      avgMonthlyIncome:
        example: 1840000
        type: integer
      periodMonths:
        example: 12
        type: integer
      source:
        allOf:
        - $ref: '#/definitions/shared.CheckSource'
        example: BANK_ACCOUNTS
    type: object
  httpx.ErrorBody:
    properties:
      code:
        type: string
      fields:
        items:
          $ref: '#/definitions/httpx.FieldError'
        type: array
      message:
        type: string
      traceId:
        type: string
    type: object
  httpx.FieldError:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  identity.companyDTO:
    properties:
      id:
        example: c-1
        type: string
      inn:
        example: "7712345678"
        type: string
      name:
        example: ООО «Северная пекарня»
        type: string
    type: object
  identity.loginRequest:
    properties:
      login:
        example: smirnov
        type: string
      password:
        example: demo123
        type: string
    required:
    - login
    - password
    type: object
  identity.loginResponse:
    properties:
      redirect:
        example: /
        type: string
      user:
        $ref: '#/definitions/identity.userDTO'
    type: object
  identity.meResponse:
    properties:
      company:
        $ref: '#/definitions/identity.companyDTO'
      fullName:
        type: string
      id:
        type: string
      position:
        type: string
      role:
        $ref: '#/definitions/shared.Role'
    type: object
  identity.userDTO:
    properties:
