basePath: /api/v1
definitions:
  company.candidateDTO:
    properties:
      fullName:
        example: Смирнов Олег Викторович
        type: string
      personId:
        example: p-1
        type: string
      roles:
        example:
        - HEAD
        - FOUNDER
        items:
          $ref: '#/definitions/shared.PersonRole'
        type: array
    type: object
  company.founderDTO:
    properties:
      fullName:
        example: Смирнов Олег Викторович
        type: string
      personId:
        example: p-1
        type: string
      share:
        example: 100
        type: number
    type: object
  company.girboDTO:
    properties:
      accounted:
        example: true
        type: boolean
    type: object
  company.okvedDTO:
    properties:
      code:
        example: "10.71"
        type: string
      name:
        example: Производство хлеба
        type: string
    type: object
  company.personRefDTO:
    properties:
      fullName:
        example: Смирнов Олег Викторович
        type: string
      personId:
        example: p-1
        type: string
    type: object
  company.profileResponse:
    properties:
      actualAddress:
        example: г. Москва, ул. Складская, 3
        type: string
      founders:
        items:
          $ref: '#/definitions/company.founderDTO'
        type: array
      girbo:
        allOf:
        - $ref: '#/definitions/company.girboDTO'
        description: 'null у ИП: ГИР БО ведётся только по юрлицам'
      guarantorCandidates:
        items:
          $ref: '#/definitions/company.candidateDTO'
        type: array
      head:
        $ref: '#/definitions/company.personRefDTO'
      okved:
        $ref: '#/definitions/company.okvedDTO'
      regAddress:
        example: г. Москва, ул. Пекарская, 7
        type: string
      source:
        example:
        - BANK
        - EGRUL
        items:
          $ref: '#/definitions/shared.CheckSource'
        type: array
      taxRegime:
        example: USN_INCOME_MINUS_EXPENSES
        type: string
      turnover:
        $ref: '#/definitions/company.turnoverDTO'
    type: object
  company.turnoverDTO:
    properties:
      avgMonthlyIncome:
        example: 1840000
        type: integer
      periodMonths:
        example: 12
        type: integer
      source:
        allOf:
        - $ref: '#/definitions/shared.CheckSource'
        example: BANK_ACCOUNTS
    type: object
  httpx.ErrorBody:
    properties:
      code:
        type: string
      fields:
        items:
          $ref: '#/definitions/httpx.FieldError'
        type: array
      message:
        type: string
      traceId:
        type: string
    type: object
  httpx.FieldError:
    properties:
      code:
        type: string
      field:
        type: string
      message:
        type: string
    type: object
  identity.companyDTO:
    properties:
      id:
        example: c-1
        type: string
      inn:
        example: "7712345678"
        type: string
      name:
        example: ООО «Северная пекарня»
        type: string
    type: object
  identity.loginRequest:
    properties:
      login:
        example: smirnov
        type: string
      password:
        example: demo123
        type: string
    required:
    - login
    - password
    type: object
  identity.loginResponse:
    properties:
      redirect:
        example: /
        type: string
      user:
        $ref: '#/definitions/identity.userDTO'
    type: object
  identity.meResponse:
    properties:
      company:
        $ref: '#/definitions/identity.companyDTO'
      fullName:
        type: string
      id:
        type: string
      position:
        type: string
      role:
        $ref: '#/definitions/shared.Role'
    type: object
  identity.userDTO:
    properties:
      companyId:
        example: c-1
        type: string
      fullName:
        example: Смирнов Олег Викторович
        type: string
      id:
        example: u-1
        type: string
      position:
        example: Генеральный директор
        type: string
      role:
        allOf:
        - $ref: '#/definitions/shared.Role'
        example: CLIENT
    type: object
  scoring.choiceParams:
    properties:
      amount:
        example: 3000000
        type: integer
      term:
        example: 24
        type: integer
    type: object
  scoring.choiceRequest:
    properties:
      amount:
        example: 3000000
        minimum: 0
        type: integer
      choice:
        allOf:
        - $ref: '#/definitions/shared.PrelimChoice'
        enum:
        - REDUCE_AMOUNT
        - KEEP_AMOUNT
        example: REDUCE_AMOUNT
    required:
    - choice
    type: object
  scoring.choiceResponse:
    properties:
      params:
        $ref: '#/definitions/scoring.choiceParams'
      stage:
        example: 2
        type: integer
      version:
        example: 9
        type: integer
    type: object
  scoring.factorDTO:
    properties:
      code:
        example: DEBT_LOAD
        type: string
      impact:
        example: -70
        type: integer
      label:
        example: Долговая нагрузка 47% от оборота
        type: string
    type: object
  scoring.prelimCheck:
    properties:
      label:
        example: Действует, 11 лет
        type: string
      source:
        allOf:
        - $ref: '#/definitions/shared.CheckSource'
        example: EGRUL
      status:
        allOf:
        - $ref: '#/definitions/shared.CheckStatus'
        example: OK
    type: object
  scoring.prelimResponse:
    properties:
      amountFits:
        example: true
        type: boolean
      checks:
        items:
          $ref: '#/definitions/scoring.prelimCheck'
        type: array
      limit:
        example: 3000000
        type: integer
      outcome:
        allOf:
        - $ref: '#/definitions/shared.PrelimOutcome'
        example: LIMIT
      prelimPayment:
        example: 77800
        type: integer
      prelimRate:
        example: 22
        type: number
      requestedAmount:
        example: 1500000
        type: integer
      stopReason:
        example: BUSINESS_TOO_YOUNG
        type: string
      stopText:
        example: Бизнес зарегистрирован меньше 6 месяцев назад
        type: string
      whatToDo:
        items:
          type: string
        type: array
    type: object
  scoring.scoreResponse:
    properties:
      autoDecisionEligible:
        example: false
        type: boolean
      autoDecisionReason:
        example: Пограничный балл
        type: string
      factors:
        items:
          $ref: '#/definitions/scoring.factorDTO'
        type: array
      modelVersion:
        example: rules-v1
        type: string
      riskBand:
        allOf:
        - $ref: '#/definitions/shared.RiskBand'
        example: MEDIUM
      score:
        example: 640
        type: integer
      suggested:
        $ref: '#/definitions/scoring.suggestedDTO'
    type: object
  scoring.suggestedDTO:
    properties:
      amount:
        example: 1200000
        type: integer
      decision:
        allOf:
        - $ref: '#/definitions/shared.Status'
        example: COUNTER_OFFER
      rate:
        example: 21.5
        type: number
    type: object
  shared.CheckSource:
    enum:
    - BANK
    - BANK_ACCOUNTS
    - EGRUL
    - TRANSPARENT_BUSINESS
    - BKI
    - FNS
    - GIRBO
    - COURTS
    type: string
    x-enum-comments:
      SourceEGRUL: ЕГРЮЛ или ЕГРИП — по типу компании
      SourceGIRBO: только ООО
    x-enum-descriptions:
    - ""
    - ""
    - ЕГРЮЛ или ЕГРИП — по типу компании
    - ""
    - ""
    - ""
    - только ООО
    - ""
    x-enum-varnames:
    - SourceBank
    - SourceBankAccounts
    - SourceEGRUL
    - SourceTransparentBusiness
    - SourceBKI
    - SourceFNS
    - SourceGIRBO
    - SourceCourts
  shared.CheckStatus:
    enum:
    - OK
    - WARN
    - FAIL
    - UNAVAILABLE
    type: string
    x-enum-varnames:
    - CheckOK
    - CheckWarn
    - CheckFail
    - CheckUnavailable
  shared.DecisionMode:
    enum:
    - AUTO
    - MANUAL
    type: string
    x-enum-varnames:
    - DecisionAuto
    - DecisionManual
  shared.PersonRole:
    enum:
    - HEAD
    - FOUNDER
    - REPRESENTATIVE
    type: string
    x-enum-varnames:
    - PersonHead
    - PersonFounder
    - PersonRepresentative
  shared.PrelimChoice:
    enum:
    - REDUCE_AMOUNT
    - KEEP_AMOUNT
    type: string
    x-enum-varnames:
    - ChoiceReduceAmount
    - ChoiceKeepAmount
  shared.PrelimOutcome:
    enum:
    - LIMIT
    - STOP
    type: string
    x-enum-varnames:
    - PrelimLimit
    - PrelimStop
  shared.RiskBand:
    enum:
    - LOW
    - MEDIUM
    - HIGH
    type: string
    x-enum-varnames:
    - RiskLow
    - RiskMedium
    - RiskHigh
  shared.Role:
    enum:
    - CLIENT
    - BANK_OFFICER
    type: string
    x-enum-varnames:
    - RoleClient
    - RoleBankOfficer
  shared.Status:
    enum:
    - DRAFT
    - SUBMITTED
    - DATA_CHECK
    - INFO_REQUESTED
    - SCORING
    - ON_DECISION
    - APPROVED
    - COUNTER_OFFER
    - REJECTED
    - SIGNING
    - ISSUED
    - CLOSED
    type: string
    x-enum-varnames:
    - StatusDraft
    - StatusSubmitted
    - StatusDataCheck
    - StatusInfoRequested
    - StatusScoring
    - StatusOnDecision
    - StatusApproved
    - StatusCounterOffer
    - StatusRejected
    - StatusSigning
    - StatusIssued
    - StatusClosed
  underwriting.assignResponse:
    properties:
      assignee:
        $ref: '#/definitions/underwriting.assigneeDTO'
    type: object
  underwriting.assigneeDTO:
    properties:
      fullName:
        example: Иванова Е. П.
        type: string
      id:
        example: u-9
        type: string
    type: object
  underwriting.companyRefDTO:
    properties:
      inn:
        example: "7712345678"
        type: string
      name:
        example: ООО «Северная пекарня»
        type: string
    type: object
  underwriting.productRefDTO:
    properties:
      code:
        example: WORKING
        type: string
      name:
        example: Оборотный кредит
        type: string
    type: object
  underwriting.queueItemDTO:
    properties:
      amount:
        example: 1500000
        type: integer
      assignee:
        $ref: '#/definitions/underwriting.assigneeDTO'
      company:
        $ref: '#/definitions/underwriting.companyRefDTO'
      decisionMode:
        allOf:
        - $ref: '#/definitions/shared.DecisionMode'
        example: MANUAL
      id:
        example: a-1024
        type: string
      number:
        example: КЗ-2026-001024
        type: string
      product:
        $ref: '#/definitions/underwriting.productRefDTO'
      riskBand:
        allOf:
        - $ref: '#/definitions/shared.RiskBand'
        example: MEDIUM
      score:
        example: 640
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/shared.Status'
        example: ON_DECISION
      submittedAt:
        example: "2026-10-20T10:25:00Z"
        type: string
      term:
        example: 24
        type: integer
    type: object
  underwriting.queuePage:
    properties:
      items:
        items:
          $ref: '#/definitions/underwriting.queueItemDTO'
        type: array
      page:
        example: 1
        type: integer
      size:
        example: 20
        type: integer
      total:
        example: 5
        type: integer
    type: object
  underwriting.statsResponse:
    properties:
      DATA_CHECK:
        example: 2
        type: integer
      INFO_REQUESTED:
        example: 4
        type: integer
      ON_DECISION:
        example: 5
        type: integer
      SCORING:
        example: 1
        type: integer
      SUBMITTED:
        example: 3
        type: integer
      decidedToday:
        example: 7
        type: integer
    type: object
info:
  contact: {}
  description: REST API кредитного кабинета для юрлиц и ИП и рабочего места банка.
  title: Умный кредитный кабинет API
  version: "1.0"
paths:
  /applications/{id}/company-profile:
    get:
      description: Профиль из клиентской базы банка, сверенный с реестрами. Только
        для чтения.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/company.profileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Данные о компании для заявки
      tags:
      - applications
  /applications/{id}/prelim:
    post:
      description: Проверки ЕГРЮЛ/ЕГРИП, БКИ, ФНС, суды, ГИР БО, обороты по счетам
        в банке. Лимит или стоп-отказ. Требует согласие на БКИ.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scoring.prelimResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Предварительное решение (этап 1)
      tags:
      - applications
  /applications/{id}/prelim/choice:
    post:
      consumes:
      - application/json
      description: REDUCE_AMOUNT — уменьшить сумму до лимита, KEEP_AMOUNT — оставить
        запрошенную (решит сотрудник банка).
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Выбор клиента
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scoring.choiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scoring.choiceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Выбор при сумме выше лимита
      tags:
      - applications
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Учётные данные
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/identity.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.loginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Вход по логину и паролю
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Завершить сессию
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.meResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Текущий пользователь
      tags:
      - auth
  /bank/applications:
    get:
      description: 'Таблица заявок с фильтрами. sort: submittedAt, updatedAt, amount,
        score; «-» в начале — по убыванию.'
      parameters:
      - description: Статус
        in: query
        name: status
        type: string
      - description: Код продукта
        in: query
        name: product
        type: string
      - description: LOW, MEDIUM, HIGH
        in: query
        name: risk
        type: string
      - description: AUTO, MANUAL
        in: query
        name: decisionMode
        type: string
      - default: -submittedAt
        description: Сортировка
        in: query
        name: sort
        type: string
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      - default: 20
        description: Размер страницы
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/underwriting.queuePage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Очередь заявок
      tags:
      - bank
  /bank/applications/{id}/assign:
    post:
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/underwriting.assignResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Взять заявку в работу
      tags:
      - bank
  /bank/applications/{id}/score:
    get:
      description: Итоговый балл, вклад каждого фактора и рекомендация решения. Только
        для сотрудника банка.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scoring.scoreResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Скоринг заявки
      tags:
      - bank
  /bank/applications/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/underwriting.statsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Счётчики очереди
      tags:
      - bank
swagger: "2.0"
