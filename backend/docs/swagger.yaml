      - applications
  /applications/{id}/validate:
    post:
      description: Что ещё нужно для отправки. Подтверждение достоверности приходит
        при отправке, здесь оно всегда в списке.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
