        example: "2026-11-20"
        type: string
      monthlyPayment:
        example: 61958
        type: integer
      productCode:
        example: WORKING
        type: string
      rate:
        example: 21.5
        type: number
      term:
        example: 24
        type: integer
    type: object
  offer.declineRequest:
    properties:
      reason:
        example: Нашли финансирование в другом месте
