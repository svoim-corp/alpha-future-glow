      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Выбор клиента
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/scoring.choiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/scoring.choiceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Выбор при сумме выше лимита
      tags:
      - applications
  /applications/{id}/submit:
    post:
      consumes:
      - application/json
      description: Проверка полноты, номер заявки, статус SUBMITTED и запуск банковского
        конвейера в фоне.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Версия заявки
        in: header
        name: If-Match
        required: true
        type: string
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        type: string
      - description: Подтверждение достоверности
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/origination.submitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/origination.submitResponse'
        "400":
          description: Заявка заполнена не полностью — поля как в validate
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Отправить заявку в банк
      tags:
      - applications
  /applications/{id}/timeline:
    get:
      description: 'Что сейчас происходит, что делать дальше, чей ход, и шаги: пройденные,
