      prelim:
        $ref: '#/definitions/underwriting.reviewPrelimDTO'
      request:
        $ref: '#/definitions/underwriting.requestDTO'
      status:
        allOf:
        - $ref: '#/definitions/shared.Status'
        example: ON_DECISION
      turnover:
        $ref: '#/definitions/underwriting.reviewTurnoverDTO'
    type: object
  underwriting.reviewTurnoverDTO:
    properties:
      avgMonthlyIncome:
        example: 1840000
        type: integer
      periodMonths:
        example: 12
        type: integer
      source:
        allOf:
        - $ref: '#/definitions/shared.CheckSource'
        example: BANK_ACCOUNTS
    type: object
  underwriting.severity:
    enum:
    - INFO
    - WARN
    - BLOCKER
    type: string
    x-enum-varnames:
    - sevInfo
    - sevWarn
    - sevBlocker
  underwriting.statsResponse:
    properties:
      DATA_CHECK:
        example: 2
        type: integer
      INFO_REQUESTED:
        example: 4
        type: integer
      ON_DECISION:
        example: 5
        type: integer
      SCORING:
        example: 1
        type: integer
      SUBMITTED:
        example: 3
        type: integer
      decidedToday:
        example: 7
        type: integer
    type: object
info:
  contact: {}
  description: REST API кредитного кабинета для юрлиц и ИП и рабочего места банка.
  title: Умный кредитный кабинет API
  version: "1.0"
paths:
  /applications:
    get:
      description: 'Блок «Мои заявки»: черновики и поданные заявки компании, недавно
        изменённые первыми.'
      parameters:
      - description: Заявки своей компании (клиент видит только их)
        in: query
        name: mine
        type: boolean
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      - default: 20
        description: Размер страницы (до 100)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/origination.applicationsPage'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Заявки компании
      tags:
      - applications
    post:
      consumes:
      - application/json
      description: Кнопка «Оформить». Компания берётся из пользователя, полномочия
        заявителя — из данных банка.
      parameters:
      - description: Параметры из подбора
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/origination.createRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/origination.createResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: 'Нет полномочий: не руководитель и нет действующей МЧД'
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Создать черновик заявки
      tags:
      - applications
  /applications/{id}:
    delete:
      description: Только черновик. Заявка закрывается (DRAFT → CLOSED) и пропадает
        из списка клиента.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Удалить черновик
      tags:
      - applications
    get:
      description: 'Полное состояние заявки: этап, параметры, данные банка (только
        чтение), результат этапа 1, блокировки.'
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/origination.applicationDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Заявка для мастера и карточки
      tags:
      - applications
    patch:
      consumes:
      - application/json
      description: 'Передаются только изменённые поля: params и stage2.guarantor.personId.
        Данные банка не меняются — 400.'
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Версия заявки
        in: header
        name: If-Match
        required: true
        type: string
      - description: Изменённые поля
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/origination.patchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/origination.patchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Автосохранение черновика
      tags:
      - applications
  /applications/{id}/company-profile:
    get:
      description: Профиль из клиентской базы банка, сверенный с реестрами. Только
        для чтения.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/company.profileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Данные о компании для заявки
      tags:
      - applications
  /applications/{id}/consents/bki:
    post:
      consumes:
      - application/json
      description: 'Фиксирует согласие заявителя: кто, когда, по какой заявке. Нужно
        для этапа 1. Повтор возвращает уже данное.'
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Согласие
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/origination.consentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/origination.consentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Нет полномочия BKI_CONSENT по доверенности
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Согласие на запрос в БКИ
      tags:
      - applications
  /applications/{id}/contract:
    get:
      description: Итоговые условия и документы. Есть после принятия предложения;
        договор поручительства — только у ООО с поручителем.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/offer.contractResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Предложение ещё не принято
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Договор к подписанию
      tags:
      - offer
  /applications/{id}/contract/documents/{docId}:
    get:
      description: HTML для открытия в новой вкладке. Формирует банк по условиям принятого
        предложения; это не загрузка файлов клиента.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: ID документа
        enum:
        - d-1
        - d-2
        in: path
        name: docId
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: Печатная форма
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Документа нет или предложение не принято
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Печатная форма документа договора
      tags:
      - offer
  /applications/{id}/contract/sign:
    post:
      consumes:
      - application/json
      description: Имитация подписи без SMS (модалка «Подтверждение подписи»). Только
        в статусе SIGNING.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Ключ идемпотентности
        in: header
        name: Idempotency-Key
        type: string
      - description: Подтверждение
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/offer.signRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/offer.signResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Не статус подписания или уже подписан
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Подписать договор
      tags:
      - offer
  /applications/{id}/guarantor/consent-bki:
    post:
      consumes:
      - application/json
      description: Для выбранного поручителя, на этапе 2. При смене поручителя согласие
        нужно дать заново.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Согласие
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/origination.guarantorConsentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/origination.guarantorConsentResponse'
        "400":
          description: Поручитель не выбран
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Не черновик или этап 1 не пройден
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Согласие поручителя на запрос в БКИ
      tags:
      - applications
  /applications/{id}/info-requests:
    get:
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/underwriting.infoRequestDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Запросы банка по заявке
      tags:
      - applications
  /applications/{id}/info-requests/{reqId}/answer:
    post:
      consumes:
      - application/json
      description: Ответ на каждый вопрос запроса. Заявка возвращается в DATA_CHECK.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: ID запроса
        in: path
        name: reqId
        required: true
        type: string
      - description: Ответы
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/underwriting.answerBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/underwriting.answerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Ответить на запрос банка
      tags:
      - applications
  /applications/{id}/offer:
    get:
      description: Появляется после решения. Одобрение и иные условия — запрошенные
        и предложенные условия; отказ — причина и альтернативы.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/offer.offerResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Заявки нет или решения ещё нет
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Решение банка и предложение
      tags:
      - offer
  /applications/{id}/offer/accept:
    post:
      description: Одобрение или иные условия. Договор получает номер, заявка — статус
        SIGNING. Тела нет.
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/offer.statusResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "409":
          description: Отказ, уже принято или заявка не в статусе решения
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "422":
          description: Срок действия предложения истёк
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Принять предложение банка
      tags:
      - offer
  /applications/{id}/offer/decline:
