  offer.offeredDTO:
    properties:
      amount:
        example: 1200000
        type: integer
      monthlyPayment:
        example: 61958
        type: integer
      productCode:
        example: WORKING
        type: string
      rate:
        example: 21.5
        type: number
      term:
        example: 24
        type: integer
