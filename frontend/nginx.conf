server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m; # выписка из 1С — до 10 МБ

    # API, Swagger и OpenAPI — на сервер.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Хешированные ассеты сборки можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: все остальные пути отдаём index.html, роутинг на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
